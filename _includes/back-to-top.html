<a href="#" id="cagp-back-to-top" class="cagp-back-to-top" aria-label="Voltar ao início da página"><i class="bi bi-arrow-up" aria-hidden="true"></i> Topo</a>
<script data-cagp-persistent-script="true">
(function () {
  'use strict';

  if (window.__cagpBackToTopMounted) return;
  window.__cagpBackToTopMounted = true;

  const btn = document.getElementById('cagp-back-to-top');
  if (btn) {
    const toggleVisible = function () {
      if (window.scrollY > 280) {
        btn.classList.add('is-visible');
      } else {
        btn.classList.remove('is-visible');
      }
    };
    window.addEventListener('scroll', toggleVisible, { passive: true });
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    toggleVisible();
  }

  // Handler unificado de cópia rápida com feedback tátil + Dynamic Island Toast
  document.addEventListener('click', function (e) {
    const copyBtn = e.target && e.target.closest ? (e.target.closest('[data-cagp-copy]') || e.target.closest('[data-copy]')) : null;
    if (!copyBtn) return;
    const text = copyBtn.getAttribute('data-cagp-copy') || copyBtn.getAttribute('data-copy');
    if (!text) return;

    const copyAction = function () {
      const originalHtml = copyBtn.innerHTML;
      copyBtn.classList.add('is-copied');
      copyBtn.setAttribute('aria-label', 'Copiado para a área de transferência!');
      copyBtn.innerHTML = '<i class="bi bi-check2" aria-hidden="true"></i> Copiado!';
      if (window.cagpToast) {
        window.cagpToast('Copiado: ' + text, 'bi-check2-circle', 2200);
      }
      setTimeout(function () {
        copyBtn.classList.remove('is-copied');
        copyBtn.innerHTML = originalHtml;
        copyBtn.setAttribute('aria-label', 'Copiar ' + text);
      }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copyAction).catch(function () {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyAction();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyAction();
    }
  });

  // Gerenciamento Global do Padrão TipKit Contextual (Apple HIG TipKit)
  function initTipKitCards() {
    document.querySelectorAll('.cagp-tipkit-card[id]').forEach(function (card) {
      const tipId = card.id;
      try {
        if (localStorage.getItem('cagp_tip_' + tipId) === 'dismissed') {
          card.style.display = 'none';
          return;
        }
      } catch (e) {}
      card.style.display = '';
    });
  }

  document.addEventListener('click', function (e) {
    const closeBtn = e.target && e.target.closest ? e.target.closest('[data-dismiss-tip]') : null;
    if (!closeBtn) return;
    const tipId = closeBtn.getAttribute('data-dismiss-tip');
    const card = document.getElementById(tipId) || closeBtn.closest('.cagp-tipkit-card');
    if (card) {
      card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
      card.style.opacity = '0';
      card.style.transform = 'translateY(-4px)';
      setTimeout(function () {
        card.style.display = 'none';
      }, 200);
      try {
        localStorage.setItem('cagp_tip_' + (tipId || card.id), 'dismissed');
      } catch (e) {}
    }
  });

  window.cagpResetTips = function () {
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.startsWith('cagp_tip_')) localStorage.removeItem(k);
      });
      initTipKitCards();
    } catch (e) {}
  };

  initTipKitCards();
  window.addEventListener('cagp:navigated', initTipKitCards);
})();
</script>
