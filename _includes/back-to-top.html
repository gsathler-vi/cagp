<a href="#" id="cagp-back-to-top" class="cagp-back-to-top" aria-label="Voltar ao início da página"><i class="bi bi-arrow-up" aria-hidden="true"></i> Topo</a>
<script data-cagp-persistent-script="true">
(function () {
  'use strict';

  if (window.__cagpBackToTopMounted) return;
  window.__cagpBackToTopMounted = true;

  const btn = document.getElementById('cagp-back-to-top');
  if (btn) {
    const toggleVisible = function () {
      if (window.scrollY > 280) {
        btn.classList.add('is-visible');
      } else {
        btn.classList.remove('is-visible');
      }
    };
    window.addEventListener('scroll', toggleVisible, { passive: true });
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    toggleVisible();
  }

  // Handler unificado de cópia rápida com feedback tátil + Dynamic Island Toast
  document.addEventListener('click', function (e) {
    const copyBtn = e.target && e.target.closest ? e.target.closest('[data-copy]') : null;
    if (!copyBtn) return;
    const text = copyBtn.getAttribute('data-copy');
    if (!text) return;

    const copyAction = function () {
      const originalHtml = copyBtn.innerHTML;
      copyBtn.classList.add('is-copied');
      copyBtn.setAttribute('aria-label', 'Copiado para a área de transferência!');
      copyBtn.innerHTML = '<i class="bi bi-check2" aria-hidden="true"></i> Copiado!';
      if (window.cagpToast) {
        window.cagpToast('Copiado: ' + text, 'bi-check2-circle', 2200);
      }
      setTimeout(function () {
        copyBtn.classList.remove('is-copied');
        copyBtn.innerHTML = originalHtml;
        copyBtn.setAttribute('aria-label', 'Copiar ' + text);
      }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copyAction).catch(function () {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyAction();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyAction();
    }
  });
})();
</script>
