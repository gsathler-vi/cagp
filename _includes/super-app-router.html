<!-- Motor de Roteamento SPA e Transições Nativas Super App CAGP UFMG -->
<script>
(function () {
  'use strict';

  // Super App Client-Side Router & View Transition Engine
  const cache = new Map();

  function isInternalLink(anchor) {
    if (!anchor || anchor.tagName !== 'A') return false;
    const href = anchor.getAttribute('href');
    if (!href) return false;
    if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return false;
    if (anchor.getAttribute('target') === '_blank' || anchor.hasAttribute('download')) return false;
    if (anchor.getAttribute('data-no-spa') !== null) return false;

    // Verificar se pertence à mesma origem
    try {
      const url = new URL(anchor.href, window.location.href);
      return url.origin === window.location.origin;
    } catch (e) {
      return false;
    }
  }

  function prefetch(url) {
    if (cache.has(url)) return;
    fetch(url, { priority: 'low' })
      .then(function (res) {
        if (res.ok) return res.text();
        throw new Error('Prefetch falhou');
      })
      .then(function (html) {
        cache.set(url, html);
      })
      .catch(function () {});
  }

  // Pré-carregamento imediato no hover e no toque (Zero-latency navigation)
  document.addEventListener('pointerenter', function (e) {
    const a = e.target.closest('a');
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  document.addEventListener('touchstart', function (e) {
    const a = e.target.closest('a');
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  async function loadPage(url) {
    if (cache.has(url)) {
      return cache.get(url);
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    cache.set(url, html);
    return html;
  }

  function updateNavigationUI(targetUrl) {
    try {
      const url = new URL(targetUrl, window.location.href);
      const pathname = url.pathname.split('/').pop() || 'index.html';

      // 1. Atualizar Navbar Superior do Quarto
      document.querySelectorAll('.navbar-nav .nav-link').forEach(function (link) {
        const href = link.getAttribute('href');
        if (href) {
          const linkPath = href.split('/').pop();
          if (linkPath === pathname || (linkPath === 'index.html' && pathname === '')) {
            link.classList.add('active');
            link.setAttribute('aria-current', 'page');
          } else {
            link.classList.remove('active');
            link.removeAttribute('aria-current');
          }
        }
      });

      // 2. Atualizar Barra Móvel Inferior (Thumb-first)
      const mobileMap = {
        'index.html': 'cagp-mnav-inicio',
        '': 'cagp-mnav-inicio',
        'percurso.html': 'cagp-mnav-percurso',
        'acg.html': 'cagp-mnav-acg',
        'faq.html': 'cagp-mnav-faq'
      };
      document.querySelectorAll('.cagp-mobile-nav-item').forEach(function (item) {
        item.classList.remove('is-active');
      });
      const activeId = mobileMap[pathname];
      if (activeId) {
        const activeEl = document.getElementById(activeId);
        if (activeEl) activeEl.classList.add('is-active');
      }
    } catch (e) {
      console.warn('CAGP Router: Erro ao sincronizar UI de navegação:', e);
    }
  }

  function executePageScripts(container) {
    const scripts = container.querySelectorAll('script');
    scripts.forEach(function (oldScript) {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function (attr) {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function applyPageSwap(doc, targetUrl) {
    // 1. Título do Documento
    const newTitle = doc.querySelector('title');
    if (newTitle) document.title = newTitle.textContent;

    // 2. Classes do Body
    if (doc.body) {
      document.body.className = doc.body.className;
    }

    // 3. Margin Sidebar (TOC)
    const currentSidebar = document.getElementById('quarto-margin-sidebar');
    const newSidebar = doc.getElementById('quarto-margin-sidebar');
    if (currentSidebar && newSidebar) {
      currentSidebar.innerHTML = newSidebar.innerHTML;
    } else if (currentSidebar && !newSidebar) {
      currentSidebar.innerHTML = '';
    } else if (!currentSidebar && newSidebar) {
      const main = document.getElementById('quarto-document-content');
      if (main && main.parentNode) {
        main.parentNode.insertBefore(newSidebar.cloneNode(true), main);
      }
    }

    // 4. Conteúdo Principal com Reinicialização de Scripts
    const currentMain = document.getElementById('quarto-document-content');
    const newMain = doc.getElementById('quarto-document-content');
    if (currentMain && newMain) {
      currentMain.innerHTML = newMain.innerHTML;
      executePageScripts(currentMain);
    }

    // 5. Atualizar UI de Navegação (Navbar e Barra Móvel)
    updateNavigationUI(targetUrl);

    // 6. Controle Suave de Rolagem
    try {
      const url = new URL(targetUrl, window.location.href);
      if (url.hash) {
        const targetEl = document.querySelector(url.hash);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      } else {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    } catch (e) {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // 7. Notificar Leitores de Tela via Live Region
    const announcer = document.getElementById('cagp-a11y-announcer');
    if (announcer && newTitle) {
      announcer.textContent = 'Página carregada: ' + newTitle.textContent;
    }

    // 8. Disparar Eventos de Ciclo de Vida para Inicialização de Componentes
    document.dispatchEvent(new Event('DOMContentLoaded'));
    window.dispatchEvent(new Event('load'));
    document.dispatchEvent(new CustomEvent('cagp:navigated', { detail: { url: targetUrl } }));
  }

  async function navigate(targetUrl, isBack) {
    try {
      const html = await loadPage(targetUrl);
      const parser = new DOMParser();
      const newDoc = parser.parseFromString(html, 'text/html');

      if (!isBack) {
        history.pushState({ url: targetUrl }, '', targetUrl);
      }

      const mainEl = document.getElementById('quarto-document-content');

      // Se o navegador suporta a View Transitions API nativa da Web
      if (document.startViewTransition) {
        document.startViewTransition(function () {
          applyPageSwap(newDoc, targetUrl);
        });
      } else if (mainEl) {
        // Fallback suave com animação CSS fluida
        mainEl.classList.add('cagp-page-leaving');
        setTimeout(function () {
          applyPageSwap(newDoc, targetUrl);
          mainEl.classList.remove('cagp-page-leaving');
          mainEl.classList.add('cagp-page-entering');
          setTimeout(function () {
            mainEl.classList.remove('cagp-page-entering');
          }, 280);
        }, 120);
      } else {
        applyPageSwap(newDoc, targetUrl);
      }
    } catch (err) {
      console.warn('CAGP Super App Router: Fallback para navegação tradicional:', err);
      window.location.href = targetUrl;
    }
  }

  // Interceptar cliques em links internos para navegação fluida SPA
  document.addEventListener('click', function (e) {
    // Permitir comportamento padrão do navegador com modificadores
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (e.defaultPrevented) return;

    const anchor = e.target.closest('a');
    if (!anchor || !isInternalLink(anchor)) return;

    try {
      const url = new URL(anchor.href, window.location.href);

      // Se for apenas âncora (#) na mesma página, deixa rolagem natural
      if (url.pathname === window.location.pathname && url.hash) {
        return;
      }

      e.preventDefault();
      navigate(anchor.href, false);
    } catch (err) {
      // Falha de URL, segue fluxo padrão
    }
  });

  // Histórico do navegador (botão Voltar e Avançar)
  window.addEventListener('popstate', function () {
    navigate(window.location.href, true);
  });

  // Expor API global do Super App
  window.cagpRouter = {
    navigate: navigate,
    prefetch: prefetch
  };
})();
</script>
