<!-- Motor de Roteamento SPA e Transições Nativas Super App CAGP UFMG -->
<script data-cagp-persistent-script="true">
(function () {
  'use strict';

  if (window.__cagpRouterMounted) return;
  window.__cagpRouterMounted = true;

  const cache = new Map();
  let activePageDisposers = [];
  let currentPath = window.location.pathname;

  function cleanupPreviousPageListeners() {
    while (activePageDisposers.length > 0) {
      const dispose = activePageDisposers.pop();
      try {
        dispose();
      } catch (e) {}
    }
  }

  function isInternalLink(anchor) {
    if (!anchor || anchor.tagName !== 'A') return false;
    const href = anchor.getAttribute('href');
    if (!href) return false;
    if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return false;
    if (anchor.getAttribute('target') === '_blank' || anchor.hasAttribute('download')) return false;
    if (anchor.getAttribute('data-no-spa') !== null) return false;
    if (href.endsWith('.pdf')) return false;

    try {
      const url = new URL(anchor.href, window.location.href);
      return url.origin === window.location.origin;
    } catch (e) {
      return false;
    }
  }

  function prefetch(url) {
    if (cache.has(url)) return;
    fetch(url, { priority: 'low' })
      .then(function (res) {
        if (res.ok) return res.text();
        throw new Error('Prefetch falhou');
      })
      .then(function (html) {
        cache.set(url, html);
      })
      .catch(function () {});
  }

  document.addEventListener('pointerenter', function (e) {
    const a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  document.addEventListener('touchstart', function (e) {
    const a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  async function loadPage(url) {
    if (cache.has(url)) {
      return cache.get(url);
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    cache.set(url, html);
    return html;
  }

  const DEFAULT_FALLBACK_TAXONOMY = {
    routes: {
      'index.html': { tabId: 'cagp-mnav-hoje', depth: 0, axis: 'axis-1' },
      'curso.html': { tabId: 'cagp-mnav-curso', depth: 0, axis: 'axis-2' },
      'calouros.html': { tabId: 'cagp-mnav-curso', depth: 1, axis: 'axis-2', parent: 'curso.html' },
      'pesquisa.html': { tabId: 'cagp-mnav-curso', depth: 1, axis: 'axis-2', parent: 'curso.html' },
      'percurso.html': { tabId: 'cagp-mnav-curriculo', depth: 0, axis: 'axis-3' },
      'optativas.html': { tabId: 'cagp-mnav-curriculo', depth: 1, axis: 'axis-3', parent: 'percurso.html' },
      'acg.html': { tabId: 'cagp-mnav-curriculo', depth: 1, axis: 'axis-3', parent: 'percurso.html' },
      'estagio.html': { tabId: 'cagp-mnav-curriculo', depth: 1, axis: 'axis-3', parent: 'percurso.html' },
      'tcc.html': { tabId: 'cagp-mnav-curriculo', depth: 1, axis: 'axis-3', parent: 'percurso.html' },
      'estagio-tcc.html': { tabId: 'cagp-mnav-curriculo', depth: 1, axis: 'axis-3', parent: 'percurso.html' },
      'documentos.html': { tabId: 'cagp-mnav-acervo', depth: 0, axis: 'axis-4' },
      'faq.html': { tabId: 'cagp-mnav-acervo', depth: 1, axis: 'axis-4', parent: 'documentos.html' },
      'mapa-do-site.html': { tabId: 'cagp-mnav-acervo', depth: 1, axis: 'axis-4', parent: 'documentos.html' },
      'sobre.html': { tabId: 'cagp-mnav-cagp', depth: 0, axis: 'axis-5' },
      'gestao.html': { tabId: 'cagp-mnav-cagp', depth: 1, axis: 'axis-5', parent: 'sobre.html' }
    }
  };

  function getTaxonomy() {
    return window.CAGP_TAXONOMY_V1 || DEFAULT_FALLBACK_TAXONOMY;
  }

  function resolveMobileTabId(pathname) {
    const tax = getTaxonomy();
    const basename = pathname ? pathname.split('/').pop() : 'index.html';
    const cleanName = (!basename || basename === '') ? 'index.html' : basename;
    const r = (tax.routes && tax.routes[cleanName]) || (tax.routes && tax.routes['index.html']);
    return r ? r.tabId : 'cagp-mnav-hoje';
  }

  function updateNavigationUI(targetUrl) {
    try {
      const url = new URL(targetUrl, window.location.href);
      const pathname = url.pathname.split('/').pop() || 'index.html';

      // 1. Atualizar Barra Móvel Inferior (Web Mobile) e Tab Bar do Super App (5 Eixos Canônicos)
      document.querySelectorAll('.cagp-mobile-nav-item').forEach(function (item) {
        item.classList.remove('is-active');
        item.removeAttribute('aria-current');
      });
      document.querySelectorAll('.cagp-tabbar-item').forEach(function (item) {
        item.classList.remove('is-active');
        item.setAttribute('aria-selected', 'false');
      });

      const activeId = resolveMobileTabId(pathname);
      if (activeId) {
        const activeEl = document.getElementById(activeId);
        if (activeEl) {
          activeEl.classList.add('is-active');
          activeEl.setAttribute('aria-current', 'page');
        }
        const activeStabId = activeId.replace('cagp-mnav-', 'cagp-stab-');
        const activeStabEl = document.getElementById(activeStabId);
        if (activeStabEl) {
          activeStabEl.classList.add('is-active');
          activeStabEl.setAttribute('aria-selected', 'true');
        }
      }

      // 2. Atualizar Cabeçalho Institucional Desktop (Island Nav & Dropdowns)
      document.querySelectorAll('.cagp-island-nav-link').forEach(function (link) {
        const route = link.getAttribute('data-route');
        const active = route === pathname || (route === 'index.html' && pathname === '');
        link.classList.toggle('is-active', active);
        if (active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });

      document.querySelectorAll('.cagp-island-dropdown').forEach(function (dd) {
        const items = dd.querySelectorAll('.cagp-island-dropdown-item');
        let parentActive = false;
        items.forEach(function (item) {
          const route = item.getAttribute('data-route');
          const isItemActive = route === pathname;
          item.classList.toggle('is-active', isItemActive);
          if (isItemActive) parentActive = true;
        });
        const btn = dd.querySelector('.cagp-island-dropdown-btn');
        if (btn) btn.classList.toggle('is-active', parentActive);
      });
    } catch (e) {
      console.warn('CAGP Router: Erro ao sincronizar UI de navegação:', e);
    }
  }

  /**
   * Executa os scripts locais da página recém-injetada em <main> sem disparar
   * DOMContentLoaded global no document (evitando re-execução de listeners da casca)
   * e registrando listeners de página para limpeza automática na próxima troca.
   */
  function executePageScripts(container) {
    cleanupPreviousPageListeners();

    const scripts = container.querySelectorAll('script');
    scripts.forEach(function (oldScript) {
      if (oldScript.hasAttribute('data-cagp-persistent-script')) {
        return;
      }

      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function (attr) {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;

      const immediateCallbacks = [];
      const origDocAdd = document.addEventListener.bind(document);
      const origWinAdd = window.addEventListener.bind(window);

      document.addEventListener = function (type, listener, options) {
        if (type === 'DOMContentLoaded' && typeof listener === 'function') {
          immediateCallbacks.push(listener);
          return;
        }
        origDocAdd(type, listener, options);
        activePageDisposers.push(function () {
          document.removeEventListener(type, listener, options);
        });
      };

      window.addEventListener = function (type, listener, options) {
        if (type === 'load' && typeof listener === 'function') {
          immediateCallbacks.push(listener);
          return;
        }
        origWinAdd(type, listener, options);
        activePageDisposers.push(function () {
          window.removeEventListener(type, listener, options);
        });
      };

      try {
        oldScript.parentNode.replaceChild(newScript, oldScript);
      } finally {
        document.addEventListener = origDocAdd;
        window.addEventListener = origWinAdd;
      }

      immediateCallbacks.forEach(function (fn) {
        try {
          fn(new Event('DOMContentLoaded'));
        } catch (err) {
          console.warn('CAGP Router: Erro ao inicializar script de página:', err);
        }
      });
    });
  }

  function findHashElement(hash) {
    if (!hash || hash === '#') return null;
    const rawId = hash.startsWith('#') ? hash.slice(1) : hash;
    let decodedId = rawId;
    try {
      decodedId = decodeURIComponent(rawId);
    } catch (e) {}

    let el = document.getElementById(decodedId);
    if (el) return el;
    el = document.getElementById(rawId);
    if (el) return el;
    try {
      if (window.CSS && CSS.escape) {
        el = document.querySelector('#' + CSS.escape(decodedId)) || document.querySelector('#' + CSS.escape(rawId));
        if (el) return el;
      }
    } catch (e) {}
    return null;
  }

  function applyPageSwap(doc, targetUrl) {
    try {
      currentPath = new URL(targetUrl, window.location.origin).pathname;
    } catch (e) {}

    // 1. Título do Documento
    const newTitle = doc.querySelector('title');
    if (newTitle) document.title = newTitle.textContent;

    // 2. Classes do Body e Root (Preservando estados dinâmicos como Standalone e Acessibilidade)
    const rootEl = document.documentElement;
    const isStandaloneActive = rootEl.classList.contains('cagp-is-standalone') ||
                               document.body.classList.contains('cagp-is-standalone');
    const isDyslexia = rootEl.classList.contains('cagp-dyslexia') || document.body.classList.contains('cagp-dyslexia');
    const isContrast = rootEl.classList.contains('cagp-high-contrast') || document.body.classList.contains('cagp-high-contrast');

    // Preservar todos os atributos data-a11y-* em documentElement
    const a11yAttrs = {};
    Array.from(rootEl.attributes).forEach(function (attr) {
      if (attr.name.startsWith('data-a11y-')) {
        a11yAttrs[attr.name] = attr.value;
      }
    });

    if (doc.body) {
      document.body.className = doc.body.className;
      if (isStandaloneActive) {
        rootEl.classList.add('cagp-is-standalone');
        document.body.classList.add('cagp-is-standalone');
      }
      if (isDyslexia) {
        rootEl.classList.add('cagp-dyslexia');
        document.body.classList.add('cagp-dyslexia');
      }
      if (isContrast) {
        rootEl.classList.add('cagp-high-contrast');
        document.body.classList.add('cagp-high-contrast');
      }
      Object.keys(a11yAttrs).forEach(function (key) {
        rootEl.setAttribute(key, a11yAttrs[key]);
      });
    }

    // 3. Margin Sidebar (TOC)
    const currentSidebar = document.getElementById('quarto-margin-sidebar');
    const newSidebar = doc.getElementById('quarto-margin-sidebar');
    if (currentSidebar && newSidebar) {
      currentSidebar.innerHTML = newSidebar.innerHTML;
    } else if (currentSidebar && !newSidebar) {
      currentSidebar.innerHTML = '';
    } else if (!currentSidebar && newSidebar) {
      const main = document.getElementById('quarto-document-content');
      if (main && main.parentNode) {
        main.parentNode.insertBefore(newSidebar.cloneNode(true), main);
      }
    }

    // 4. Conteúdo Principal com Reinicialização Isolada de Scripts
    const currentMain = document.getElementById('quarto-document-content');
    const newMain = doc.getElementById('quarto-document-content');
    if (currentMain && newMain) {
      const shellIdsToRemove = [
        '#quarto-announcement',
        '#cagp-chapa-banner',
        '#cagp-superapp-header',
        '#cagp-superapp-topbar',
        '#cagp-superapp-tabbar',
        '#cagp-live-pill-bar',
        '#cagp-global-bottom-sheet',
        '#cagp-global-sheet-backdrop',
        '#cagp-settings-sheet',
        '#cagp-settings-backdrop',
        '#cagp-ios-sheet',
        '#cagp-ios-backdrop',
        '#cagp-mobile-drawer',
        '.cagp-skip-links',
        '#cagp-spotlight-modal',
        '#cagp-a11y-panel',
        '#cagp-a11y-backdrop'
      ];
      shellIdsToRemove.forEach(function (sel) {
        const dup = newMain.querySelector(sel);
        if (dup) dup.remove();
      });

      // Fechar modais/sheets abertos durante a navegação
      if (window.closeCagpMobileDrawer) window.closeCagpMobileDrawer();
      if (window.closeCagpSpotlight) window.closeCagpSpotlight();
      if (window.closeCagpAppSettings) window.closeCagpAppSettings();
      if (window.cagpSheet && window.cagpSheet.close) window.cagpSheet.close();

      currentMain.innerHTML = newMain.innerHTML;
      if (window.applyCagpCampusState) {
        window.applyCagpCampusState(currentMain);
      }
      executePageScripts(currentMain);
      if (window.cagpMountWorkspace) {
        window.cagpMountWorkspace(currentMain);
      }
      if (window.cagpBindDetailsMotion) {
        window.cagpBindDetailsMotion(currentMain);
      }
      if (window.cagpApplyStagger) {
        window.cagpApplyStagger(currentMain);
      }
    }

    // 5. Atualizar UI de Navegação (Navbar, Barra Móvel e Super App)
    updateNavigationUI(targetUrl);
    if (window.updateSuperAppUI) {
      window.updateSuperAppUI(targetUrl);
    }

    // 6. Controle Suave de Rolagem e Sincronização de Sub-View Workspace
    let pathname = 'index.html';
    try {
      const url = new URL(targetUrl, window.location.href);
      pathname = url.pathname.split('/').pop() || 'index.html';
      if (url.hash) {
        if (window.cagpSyncWorkspaceFromHash) {
          window.cagpSyncWorkspaceFromHash(url.hash, { container: currentMain, scroll: true });
        }
        requestAnimationFrame(function () {
          const targetEl = findHashElement(url.hash);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth' });
          } else {
            window.scrollTo({ top: 0, behavior: 'instant' });
          }
        });
      } else {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    } catch (e) {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // 7. Notificar Leitores de Tela via Live Region
    const announcer = document.getElementById('cagp-a11y-announcer');
    if (announcer && newTitle) {
      announcer.textContent = 'Página carregada: ' + newTitle.textContent;
    }

    // 8. Disparar Eventos Canônicos de Ciclo de Vida (ZERO DOMContentLoaded global)
    const detailPayload = { url: targetUrl, path: pathname };
    document.dispatchEvent(new CustomEvent('cagp:page-mount', { bubbles: true, detail: detailPayload }));
    window.dispatchEvent(new CustomEvent('cagp:page-mount', { detail: detailPayload }));
    document.dispatchEvent(new CustomEvent('cagp:navigated', { bubbles: true, detail: detailPayload }));
    window.dispatchEvent(new CustomEvent('cagp:navigated', { detail: detailPayload }));
  }

  // =========================================================================
  // FASE 3: MOTOR DE FÍSICA ESPACIAL, ODÔMETRO rAF, HÁPTICA, STAGGER & BARRA DE ROTA
  // =========================================================================

  const ROUTE_META = {
    'index.html': { group: 0, depth: 0 },
    '': { group: 0, depth: 0 },
    'calouros.html': { group: 0, depth: 1, parent: 'index.html' },
    'curso.html': { group: 0, depth: 1, parent: 'index.html' },
    'pesquisa.html': { group: 0, depth: 1, parent: 'index.html' },
    'percurso.html': { group: 1, depth: 0 },
    'optativas.html': { group: 1, depth: 1, parent: 'percurso.html' },
    'acg.html': { group: 2, depth: 0 },
    'estagio.html': { group: 2, depth: 1, parent: 'acg.html' },
    'tcc.html': { group: 2, depth: 1, parent: 'acg.html' },
    'estagio-tcc.html': { group: 2, depth: 1, parent: 'acg.html' },
    'documentos.html': { group: 3, depth: 0 },
    'faq.html': { group: 3, depth: 1, parent: 'documentos.html' },
    'mapa-do-site.html': { group: 3, depth: 1, parent: 'documentos.html' },
    'sobre.html': { group: 4, depth: 0 },
    'gestao.html': { group: 4, depth: 0 }
  };

  function isMotionReduced() {
    if (window.cagpIsReducedMotion && typeof window.cagpIsReducedMotion === 'function') {
      return window.cagpIsReducedMotion();
    }
    const attr = document.documentElement.getAttribute('data-a11y-motion');
    return (
      attr === 'reduced' ||
      attr === 'reduce' ||
      Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    );
  }

  function computeNavDirection(fromUrl, toUrl, isBack, triggerAnchor) {
    try {
      if (triggerAnchor) {
        if (triggerAnchor.hasAttribute('data-nav-drill-out')) {
          return 'drill-out';
        }
        if (triggerAnchor.hasAttribute('data-nav-drill-in')) {
          return 'drill-in';
        }
      }
      const fromPath = new URL(fromUrl, window.location.href).pathname.split('/').pop() || 'index.html';
      const toPath = new URL(toUrl, window.location.href).pathname.split('/').pop() || 'index.html';
      const fm = ROUTE_META[fromPath] || { group: 0, depth: 0 };
      const tm = ROUTE_META[toPath] || { group: 0, depth: 0 };

      if (fm.group === tm.group && fm.depth !== tm.depth) {
        return tm.depth > fm.depth ? 'drill-in' : 'drill-out';
      }
      if (fromPath === 'index.html' && tm.depth > 0) {
        return 'drill-in';
      }
      if (fm.depth > 0 && toPath === 'index.html') {
        return 'drill-out';
      }
      if (tm.group > fm.group) return 'forward';
      if (tm.group < fm.group) return 'backward';
      return isBack ? 'backward' : 'forward';
    } catch (e) {
      return isBack ? 'backward' : 'forward';
    }
  }

  // Barra Superior de Carregamento de Rota (#cagp-route-progress-bar, z-index: 1020)
  let routeProgressEl = null;
  let routeProgressFill = null;
  let routeProgressTimer = null;

  function ensureRouteProgressBar() {
    if (routeProgressEl && document.body.contains(routeProgressEl)) return routeProgressEl;
    routeProgressEl = document.getElementById('cagp-route-progress-bar');
    if (!routeProgressEl) {
      routeProgressEl = document.createElement('div');
      routeProgressEl.id = 'cagp-route-progress-bar';
      routeProgressEl.className = 'cagp-route-progress-bar';
      routeProgressEl.setAttribute('aria-hidden', 'true');
      routeProgressEl.innerHTML = '<div class="cagp-route-progress-fill"></div>';
      if (document.body) {
        document.body.prepend(routeProgressEl);
      }
    }
    routeProgressFill = routeProgressEl.querySelector('.cagp-route-progress-fill');
    return routeProgressEl;
  }

  window.cagpRouteProgress = {
    start: function () {
      ensureRouteProgressBar();
      clearTimeout(routeProgressTimer);
      routeProgressEl.classList.add('is-active');
      if (routeProgressFill) {
        routeProgressFill.style.width = '18%';
        requestAnimationFrame(function () {
          if (routeProgressFill) routeProgressFill.style.width = '76%';
        });
      }
    },
    finish: function () {
      ensureRouteProgressBar();
      clearTimeout(routeProgressTimer);
      if (routeProgressFill) {
        routeProgressFill.style.width = '100%';
      }
      routeProgressTimer = setTimeout(function () {
        if (routeProgressEl) routeProgressEl.classList.remove('is-active');
        setTimeout(function () {
          if (routeProgressFill && (!routeProgressEl || !routeProgressEl.classList.contains('is-active'))) {
            routeProgressFill.style.width = '0%';
          }
        }, 180);
      }, 160);
    }
  };

  // Feedback Tátil (Web Vibration API)
  window.cagpHaptic = function (pattern) {
    try {
      if (isMotionReduced()) return false;
      if (navigator && typeof navigator.vibrate === 'function') {
        return navigator.vibrate(pattern || 8);
      }
    } catch (e) {}
    return false;
  };

  // Odômetro Numérico a 60/120fps via requestAnimationFrame (280ms)
  window.cagpAnimateNumber = function (el, targetVal, opts) {
    if (!el) return;
    const options = opts || {};
    const endNum = Number(targetVal) || 0;
    const prefix = options.prefix || '';
    const suffix = options.suffix || '';
    const decimals = typeof options.decimals === 'number' ? options.decimals : 0;
    const duration = typeof options.duration === 'number' ? options.duration : 280;
    const formatFn = typeof options.formatter === 'function'
      ? options.formatter
      : function (n) {
          const rounded = decimals > 0 ? n.toFixed(decimals) : String(Math.round(n));
          return prefix + rounded + suffix;
        };

    if (el._cagpRafId) {
      cancelAnimationFrame(el._cagpRafId);
      el._cagpRafId = null;
    }

    let startNum = typeof el._cagpNumCurrent === 'number' ? el._cagpNumCurrent : null;
    if (startNum === null) {
      const m = (el.textContent || '').match(/-?\d+(?:[.,]\d+)?/);
      startNum = m ? parseFloat(m[0].replace(',', '.')) : endNum;
    }

    if (isMotionReduced() || Math.abs(endNum - startNum) < 0.01 || duration <= 0) {
      el._cagpNumCurrent = endNum;
      el.textContent = formatFn(endNum);
      return;
    }

    const startTime = performance.now();
    el.classList.add('is-rolling-number');

    function tick(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      // Curva de desaceleração natural cubic-out: 1 - (1 - t)^3
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = startNum + (endNum - startNum) * eased;
      el._cagpNumCurrent = current;
      el.textContent = formatFn(current);

      if (progress < 1) {
        el._cagpRafId = requestAnimationFrame(tick);
      } else {
        el._cagpNumCurrent = endNum;
        el.textContent = formatFn(endNum);
        el._cagpRafId = null;
        el.classList.remove('is-rolling-number');
      }
    }

    el._cagpRafId = requestAnimationFrame(tick);
  };

  // Pulso Tátil em Barras de Progresso ao atingir 100%
  window.cagpPulseProgress = function (fillEl, pct) {
    if (!fillEl) return;
    const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
    const wasComplete = fillEl.getAttribute('data-was-100') === 'true';
    fillEl.style.width = clamped + '%';

    if (clamped >= 100) {
      fillEl.setAttribute('data-was-100', 'true');
      if (!wasComplete && !isMotionReduced()) {
        fillEl.classList.remove('is-pulse-100');
        void fillEl.offsetWidth;
        fillEl.classList.add('is-pulse-100');
        window.cagpHaptic([8, 24, 12]);
        setTimeout(function () {
          fillEl.classList.remove('is-pulse-100');
        }, 560);
      }
    } else {
      fillEl.setAttribute('data-was-100', 'false');
      fillEl.classList.remove('is-pulse-100');
    }
  };

  // Coreografia de Entrada Escalonada (Staggered Reveal — máx. 8 primeiros itens visíveis)
  window.cagpApplyStagger = function (rootContainer) {
    if (isMotionReduced()) return;
    const container = rootContainer || document.getElementById('quarto-document-content') || document;
    const candidates = Array.from(
      container.querySelectorAll(
        '.cagp-passport-card, .cagp-bento-card, .cagp-card, .cagp-tool-box, .cagp-calc-row, .cagp-120d-item, .cagp-timeline-step, .cagp-doc-card'
      )
    );
    const visible = [];
    for (let i = 0; i < candidates.length; i++) {
      const el = candidates[i];
      if (el.closest('[hidden]')) continue;
      if (el.offsetParent === null) continue;
      visible.push(el);
      if (visible.length >= 8) break;
    }

    visible.forEach(function (el, idx) {
      el.style.setProperty('--stagger-index', String(idx));
      el.classList.remove('cagp-stagger-enter');
      void el.offsetWidth;
      el.classList.add('cagp-stagger-enter');
      const cleanupDelay = 360 + idx * 35;
      setTimeout(function () {
        el.classList.remove('cagp-stagger-enter');
        el.style.removeProperty('--stagger-index');
      }, cleanupDelay);
    });
  };

  // Interpolação Fluida de Altura em Acordeões (<details class="cagp-discipline" / "cagp-faq-item">)
  window.cagpBindDetailsMotion = function (rootContainer) {
    const container = rootContainer || document.getElementById('quarto-document-content') || document;
    const detailsList = container.querySelectorAll('details.cagp-discipline, details.cagp-faq-item');
    detailsList.forEach(function (details) {
      if (details.getAttribute('data-cagp-motion-bound') === 'true') return;
      const summary = details.querySelector('summary');
      const body = details.querySelector('.cagp-discipline-body, .cagp-faq-body');
      if (!summary || !body) return;
      details.setAttribute('data-cagp-motion-bound', 'true');

      summary.addEventListener('click', function (e) {
        // Ignorar cliques em botões de ação dentro do summary (ex: Minha Grade)
        if (e.target && e.target.closest && e.target.closest('button, a, .cagp-disc-actions')) {
          return;
        }
        if (isMotionReduced() || typeof body.animate !== 'function') {
          return;
        }

        e.preventDefault();
        window.cagpHaptic(6);

        if (details._cagpAnim) {
          details._cagpAnim.cancel();
          details._cagpAnim = null;
        }

        const isClosing = details.hasAttribute('open');
        if (isClosing) {
          details.classList.add('is-closing');
          const startHeight = body.offsetHeight;
          body.style.overflow = 'hidden';
          const anim = body.animate(
            [
              { height: startHeight + 'px', opacity: 1 },
              { height: '0px', opacity: 0 }
            ],
            { duration: 240, easing: 'cubic-bezier(0.27, 1.06, 0.18, 1)' }
          );
          details._cagpAnim = anim;
          anim.onfinish = function () {
            details.removeAttribute('open');
            details.classList.remove('is-closing');
            body.style.height = '';
            body.style.overflow = '';
            details._cagpAnim = null;
          };
          anim.oncancel = function () {
            details.classList.remove('is-closing');
            body.style.height = '';
            body.style.overflow = '';
            details._cagpAnim = null;
          };
        } else {
          details.setAttribute('open', '');
          const endHeight = body.offsetHeight;
          body.style.overflow = 'hidden';
          const anim = body.animate(
            [
              { height: '0px', opacity: 0 },
              { height: endHeight + 'px', opacity: 1 }
            ],
            { duration: 280, easing: 'cubic-bezier(0.27, 1.06, 0.18, 1)' }
          );
          details._cagpAnim = anim;
          anim.onfinish = function () {
            body.style.height = '';
            body.style.overflow = '';
            details._cagpAnim = null;
          };
          anim.oncancel = function () {
            body.style.height = '';
            body.style.overflow = '';
            details._cagpAnim = null;
          };
        }
      });
    });
  };

  function showSkeleton(container) {
    if (!container) return;
    container.innerHTML =
      '<div class="cagp-skeleton-container" aria-busy="true" aria-label="Carregando conteúdo...">' +
        '<div class="cagp-skeleton-workspace-bar">' +
          '<div class="cagp-skeleton-eyebrow cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-line cagp-skeleton-title cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-line cagp-skeleton-sub cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-pills">' +
            '<div class="cagp-skeleton-pill cagp-shimmer"></div>' +
            '<div class="cagp-skeleton-pill cagp-shimmer"></div>' +
            '<div class="cagp-skeleton-pill cagp-shimmer"></div>' +
          '</div>' +
        '</div>' +
        '<div class="cagp-skeleton-grid">' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
        '</div>' +
      '</div>';
  }

  async function navigate(targetUrl, isBack, triggerAnchor) {
    try {
      const fromUrl = window.location.href;
      const resolvedUrl = new URL(targetUrl, fromUrl).href;
      const fromObj = new URL(fromUrl);
      const toObj = new URL(targetUrl, fromUrl);

      // Se for a mesma rota diferindo apenas no #hash, sincronizar Workspace View sem recarregar o DOM
      if (fromObj.pathname === toObj.pathname && fromObj.search === toObj.search) {
        if (!isBack && toObj.hash) {
          history.replaceState({ url: resolvedUrl }, '', resolvedUrl);
        }
        if (window.cagpSyncWorkspaceFromHash) {
          window.cagpSyncWorkspaceFromHash(toObj.hash, { scroll: true });
        }
        window.cagpRouteProgress.finish();
        return;
      }

      const navDir = computeNavDirection(fromUrl, resolvedUrl, Boolean(isBack), triggerAnchor);
      const mainEl = document.getElementById('quarto-document-content');

      document.documentElement.setAttribute('data-nav-dir', navDir);
      if (mainEl) mainEl.setAttribute('data-nav-dir', navDir);

      window.cagpRouteProgress.start();

      let skeletonTimer = null;
      if (!cache.has(resolvedUrl) && mainEl) {
        skeletonTimer = setTimeout(function () {
          showSkeleton(mainEl);
        }, 80);
      }

      const html = await loadPage(resolvedUrl);
      clearTimeout(skeletonTimer);

      const parser = new DOMParser();
      const newDoc = parser.parseFromString(html, 'text/html');

      if (!isBack) {
        history.pushState({ url: resolvedUrl, dir: navDir }, '', resolvedUrl);
      }

      const prefersReducedMotion = isMotionReduced();

      if (document.startViewTransition && !prefersReducedMotion) {
        const vt = document.startViewTransition(function () {
          applyPageSwap(newDoc, resolvedUrl);
        });
        if (vt && vt.updateCallbackDone) {
          await vt.updateCallbackDone;
        }
      } else if (mainEl && !prefersReducedMotion) {
        mainEl.classList.add('cagp-page-leaving');
        await new Promise(function (resolve) {
          setTimeout(function () {
            applyPageSwap(newDoc, resolvedUrl);
            mainEl.classList.remove('cagp-page-leaving');
            mainEl.classList.add('cagp-page-entering');
            setTimeout(function () {
              mainEl.classList.remove('cagp-page-entering');
            }, 240);
            resolve();
          }, 90);
        });
      } else {
        applyPageSwap(newDoc, resolvedUrl);
      }

      window.cagpRouteProgress.finish();
    } catch (err) {
      window.cagpRouteProgress.finish();
      console.warn('CAGP Super App Router: Fallback para navegação tradicional:', err);
      window.location.href = targetUrl;
    }
  }

  document.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (e.defaultPrevented) return;

    const anchor = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!anchor || !isInternalLink(anchor)) return;

    try {
      const url = new URL(anchor.href, window.location.href);
      if (url.pathname === window.location.pathname && url.hash) {
        if (window.cagpSyncWorkspaceFromHash) {
          window.cagpSyncWorkspaceFromHash(url.hash, { scroll: true });
        }
        return;
      }
      e.preventDefault();
      window.cagpHaptic(6);
      navigate(anchor.href, false, anchor);
    } catch (err) {}
  });

  window.addEventListener('popstate', function () {
    try {
      const newPath = new URL(window.location.href).pathname;
      if (newPath === currentPath) {
        if (window.location.hash && window.cagpSyncWorkspaceFromHash) {
          if (window.cagpSyncWorkspaceFromHash(window.location.hash, { scroll: false })) {
            return;
          }
        }
      }
    } catch (e) {}
    navigate(window.location.href, true, null);
  });

  function initKineticCurrentPage() {
    ensureRouteProgressBar();
    const mainEl = document.getElementById('quarto-document-content');
    if (mainEl) {
      window.cagpBindDetailsMotion(mainEl);
      window.cagpApplyStagger(mainEl);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initKineticCurrentPage, { once: true });
  } else {
    initKineticCurrentPage();
  }

  window.cagpRouter = {
    navigate: navigate,
    prefetch: prefetch,
    computeNavDirection: computeNavDirection
  };
  window.cagpNavigate = function (url) {
    return navigate(url, false, null);
  };
})();
</script>
