<!-- Motor de Roteamento SPA e Transições Nativas Super App CAGP UFMG -->
<script>
(function () {
  'use strict';

  // Super App Client-Side Router & View Transition Engine
  const cache = new Map();

  function isInternalLink(anchor) {
    if (!anchor || anchor.tagName !== 'A') return false;
    const href = anchor.getAttribute('href');
    if (!href) return false;
    if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return false;
    if (anchor.getAttribute('target') === '_blank' || anchor.hasAttribute('download')) return false;
    if (anchor.getAttribute('data-no-spa') !== null) return false;

    // Verificar se pertence à mesma origem
    try {
      const url = new URL(anchor.href, window.location.href);
      return url.origin === window.location.origin;
    } catch (e) {
      return false;
    }
  }

  function prefetch(url) {
    if (cache.has(url)) return;
    fetch(url, { priority: 'low' })
      .then(function (res) {
        if (res.ok) return res.text();
        throw new Error('Prefetch falhou');
      })
      .then(function (html) {
        cache.set(url, html);
      })
      .catch(function () {});
  }

  // Pré-carregamento imediato no hover e no toque (Zero-latency navigation)
  document.addEventListener('pointerenter', function (e) {
    const a = e.target.closest('a');
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  document.addEventListener('touchstart', function (e) {
    const a = e.target.closest('a');
    if (a && isInternalLink(a)) {
      prefetch(a.href);
    }
  }, { capture: true, passive: true });

  async function loadPage(url) {
    if (cache.has(url)) {
      return cache.get(url);
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    cache.set(url, html);
    return html;
  }

  function updateNavigationUI(targetUrl) {
    try {
      const url = new URL(targetUrl, window.location.href);
      const pathname = url.pathname.split('/').pop() || 'index.html';

      // 1. Atualizar Navbar Superior do Quarto
      document.querySelectorAll('.navbar-nav .nav-link').forEach(function (link) {
        const href = link.getAttribute('href');
        if (href) {
          const linkPath = href.split('/').pop();
          if (linkPath === pathname || (linkPath === 'index.html' && pathname === '')) {
            link.classList.add('active');
            link.setAttribute('aria-current', 'page');
          } else {
            link.classList.remove('active');
            link.removeAttribute('aria-current');
          }
        }
      });

      // 2. Atualizar Barra Móvel Inferior (Thumb-first)
      const mobileMap = {
        'index.html': 'cagp-mnav-inicio',
        '': 'cagp-mnav-inicio',
        'percurso.html': 'cagp-mnav-percurso',
        'documentos.html': 'cagp-mnav-docs',
        'gestao.html': 'cagp-mnav-cagp',
        'sobre.html': 'cagp-mnav-cagp'
      };
      document.querySelectorAll('.cagp-mobile-nav-item').forEach(function (item) {
        item.classList.remove('is-active');
      });
      const activeId = mobileMap[pathname];
      if (activeId) {
        const activeEl = document.getElementById(activeId);
        if (activeEl) activeEl.classList.add('is-active');
      }

      // 3. Atualizar Bespoke Super App Floating Island Navbar
      document.querySelectorAll('.cagp-island-nav-link').forEach(function (link) {
        const route = link.getAttribute('data-route');
        link.classList.toggle('is-active', route === pathname || (route === 'index.html' && pathname === ''));
      });
      document.querySelectorAll('.cagp-island-dropdown').forEach(function (dd) {
        const items = dd.querySelectorAll('.cagp-island-dropdown-item');
        let parentActive = false;
        items.forEach(function (item) {
          const route = item.getAttribute('data-route');
          const isItemActive = route === pathname;
          item.classList.toggle('is-active', isItemActive);
          if (isItemActive) parentActive = true;
        });
        const btn = dd.querySelector('.cagp-island-dropdown-btn');
        if (btn) btn.classList.toggle('is-active', parentActive);
      });
    } catch (e) {
      console.warn('CAGP Router: Erro ao sincronizar UI de navegação:', e);
    }
  }

  function executePageScripts(container) {
    const scripts = container.querySelectorAll('script');
    scripts.forEach(function (oldScript) {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function (attr) {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function findHashElement(hash) {
    if (!hash || hash === '#') return null;
    const rawId = hash.startsWith('#') ? hash.slice(1) : hash;
    let decodedId = rawId;
    try {
      decodedId = decodeURIComponent(rawId);
    } catch (e) {}

    let el = document.getElementById(decodedId);
    if (el) return el;
    el = document.getElementById(rawId);
    if (el) return el;
    try {
      if (window.CSS && CSS.escape) {
        el = document.querySelector('#' + CSS.escape(decodedId)) || document.querySelector('#' + CSS.escape(rawId));
        if (el) return el;
      }
    } catch (e) {}
    return null;
  }

  function applyPageSwap(doc, targetUrl) {
    // 1. Título do Documento
    const newTitle = doc.querySelector('title');
    if (newTitle) document.title = newTitle.textContent;

    // 2. Classes do Body (Preservando estados dinâmicos como Standalone e Acessibilidade)
    const isStandaloneActive = document.documentElement.classList.contains('cagp-is-standalone') ||
                               document.body.classList.contains('cagp-is-standalone');
    const isDyslexia = document.body.classList.contains('cagp-dyslexia');
    const isContrast = document.body.classList.contains('cagp-high-contrast');

    if (doc.body) {
      document.body.className = doc.body.className;
      if (isStandaloneActive) {
        document.documentElement.classList.add('cagp-is-standalone');
        document.body.classList.add('cagp-is-standalone');
      }
      if (isDyslexia) document.body.classList.add('cagp-dyslexia');
      if (isContrast) document.body.classList.add('cagp-high-contrast');
    }

    // 3. Margin Sidebar (TOC)
    const currentSidebar = document.getElementById('quarto-margin-sidebar');
    const newSidebar = doc.getElementById('quarto-margin-sidebar');
    if (currentSidebar && newSidebar) {
      currentSidebar.innerHTML = newSidebar.innerHTML;
    } else if (currentSidebar && !newSidebar) {
      currentSidebar.innerHTML = '';
    } else if (!currentSidebar && newSidebar) {
      const main = document.getElementById('quarto-document-content');
      if (main && main.parentNode) {
        main.parentNode.insertBefore(newSidebar.cloneNode(true), main);
      }
    }

    // 4. Conteúdo Principal com Reinicialização de Scripts
    const currentMain = document.getElementById('quarto-document-content');
    const newMain = doc.getElementById('quarto-document-content');
    if (currentMain && newMain) {
      // Remover componentes do Shell persistente que possam vir embutidos no HTML estático recebido,
      // pois eles já vivem de forma soberana e persistente na raiz do <body>
      const dupBanner = newMain.querySelector('#quarto-announcement') || newMain.querySelector('#cagp-chapa-banner');
      if (dupBanner) dupBanner.remove();

      const dupHeader = newMain.querySelector('#cagp-superapp-header');
      if (dupHeader) dupHeader.remove();

      const dupTopbar = newMain.querySelector('#cagp-superapp-topbar');
      if (dupTopbar) dupTopbar.remove();

      const dupTabbar = newMain.querySelector('#cagp-superapp-tabbar');
      if (dupTabbar) dupTabbar.remove();

      const dupSettings = newMain.querySelector('#cagp-settings-sheet');
      if (dupSettings) dupSettings.remove();

      const dupBackdrop = newMain.querySelector('#cagp-settings-backdrop');
      if (dupBackdrop) dupBackdrop.remove();

      const dupDrawer = newMain.querySelector('#cagp-mobile-drawer');
      if (dupDrawer) dupDrawer.remove();

      const dupSkipLinks = newMain.querySelector('.cagp-skip-links');
      if (dupSkipLinks) dupSkipLinks.remove();

      const dupLauncher = newMain.querySelector('#cagp-app-launcher-modal');
      if (dupLauncher) dupLauncher.remove();

      // Fechar gaveta móvel ou modais abertos durante a navegação
      if (window.closeCagpMobileDrawer) window.closeCagpMobileDrawer();
      if (window.closeCagpAppLauncher) window.closeCagpAppLauncher();
      if (window.closeCagpSpotlight) window.closeCagpSpotlight();
      if (window.closeCagpAppSettings) window.closeCagpAppSettings();

      currentMain.innerHTML = newMain.innerHTML;
      if (window.applyCagpCampusState) {
        window.applyCagpCampusState(currentMain);
      }
      executePageScripts(currentMain);
    }

    // 5. Atualizar UI de Navegação (Navbar, Barra Móvel e Super App)
    updateNavigationUI(targetUrl);
    if (window.updateSuperAppUI) {
      window.updateSuperAppUI(targetUrl);
    }

    // 6. Controle Suave de Rolagem
    try {
      const url = new URL(targetUrl, window.location.href);
      if (url.hash) {
        requestAnimationFrame(function () {
          const targetEl = findHashElement(url.hash);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth' });
          } else {
            window.scrollTo({ top: 0, behavior: 'instant' });
          }
        });
      } else {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    } catch (e) {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // 7. Notificar Leitores de Tela via Live Region
    const announcer = document.getElementById('cagp-a11y-announcer');
    if (announcer && newTitle) {
      announcer.textContent = 'Página carregada: ' + newTitle.textContent;
    }

    // 8. Disparar Eventos de Ciclo de Vida para Inicialização de Componentes
    document.dispatchEvent(new Event('DOMContentLoaded'));
    window.dispatchEvent(new Event('load'));
    document.dispatchEvent(new CustomEvent('cagp:navigated', { detail: { url: targetUrl } }));
  }

  function showSkeleton(container) {
    if (!container) return;
    container.innerHTML = 
      '<div class="cagp-skeleton-container" aria-busy="true" aria-label="Carregando conteúdo...">' +
        '<div class="cagp-skeleton-header cagp-shimmer"></div>' +
        '<div class="cagp-skeleton-line cagp-skeleton-title cagp-shimmer"></div>' +
        '<div class="cagp-skeleton-line cagp-skeleton-sub cagp-shimmer"></div>' +
        '<div class="cagp-skeleton-grid">' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
          '<div class="cagp-skeleton-card cagp-shimmer"></div>' +
        '</div>' +
      '</div>';
  }

  async function navigate(targetUrl, isBack) {
    try {
      const mainEl = document.getElementById('quarto-document-content');
      let skeletonTimer = null;
      if (!cache.has(targetUrl) && mainEl) {
        skeletonTimer = setTimeout(function () {
          showSkeleton(mainEl);
        }, 80);
      }

      const html = await loadPage(targetUrl);
      clearTimeout(skeletonTimer);

      const parser = new DOMParser();
      const newDoc = parser.parseFromString(html, 'text/html');

      if (!isBack) {
        history.pushState({ url: targetUrl }, '', targetUrl);
      }

      // Se o navegador suporta a View Transitions API nativa da Web
      if (document.startViewTransition) {
        document.startViewTransition(function () {
          applyPageSwap(newDoc, targetUrl);
        });
      } else if (mainEl) {
        // Fallback suave com animação CSS fluida
        mainEl.classList.add('cagp-page-leaving');
        setTimeout(function () {
          applyPageSwap(newDoc, targetUrl);
          mainEl.classList.remove('cagp-page-leaving');
          mainEl.classList.add('cagp-page-entering');
          setTimeout(function () {
            mainEl.classList.remove('cagp-page-entering');
          }, 280);
        }, 120);
      } else {
        applyPageSwap(newDoc, targetUrl);
      }
    } catch (err) {
      console.warn('CAGP Super App Router: Fallback para navegação tradicional:', err);
      window.location.href = targetUrl;
    }
  }

  // Interceptar cliques em links internos para navegação fluida SPA
  document.addEventListener('click', function (e) {
    // Permitir comportamento padrão do navegador com modificadores
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (e.defaultPrevented) return;

    const anchor = e.target.closest('a');
    if (!anchor || !isInternalLink(anchor)) return;

    try {
      const url = new URL(anchor.href, window.location.href);

      // Se for apenas âncora (#) na mesma página, deixa rolagem natural
      if (url.pathname === window.location.pathname && url.hash) {
        return;
      }

      e.preventDefault();
      navigate(anchor.href, false);
    } catch (err) {
      // Falha de URL, segue fluxo padrão
    }
  });

  // Histórico do navegador (botão Voltar e Avançar)
  window.addEventListener('popstate', function () {
    navigate(window.location.href, true);
  });

  // Expor API global do Super App
  window.cagpRouter = {
    navigate: navigate,
    prefetch: prefetch
  };
})();
</script>
