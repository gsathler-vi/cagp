project:
  type: website
  output-dir: docs
  resources:
    - "documentos/**"
    - "logos/cagp/**"
    - "imagens/**"
    - "manifest.webmanifest"
    - "sw.js"
  render:
    - index.qmd
    - curso.qmd
    - calouros.qmd
    - percurso.qmd
    - estagio-tcc.qmd
    - acg.qmd
    - documentos.qmd
    - faq.qmd
    - sobre.qmd
    - gestao.qmd
    - mapa-do-site.qmd

website:
  title: "CAGP"
  search: false
  site-url: "https://cagp-ufmg.github.io"
  description: "Centro Acadêmico de Gestão Pública - FAFICH / UFMG"
  favicon: "logos/cagp/10_simbolo_transparente_positivo.svg"

  announcement:
    icon: megaphone-fill
    dismissable: false
    position: above-navbar
    type: danger
    content: |
      <span class="cagp-announcement-badge">PROPOSTA DE CHAPA</span> Este portal é uma proposta e projeto da <strong class="cagp-chapa-highlight">Chapa [Nome da Chapa a Definir]</strong> para a gestão do <strong>CAGP (FAFICH/UFMG)</strong>. Como nosso compromisso prioritário é com os discentes, <strong>independentemente do resultado da eleição, disponibilizaremos este projeto completo para a gestão vencedora</strong>, pois a transparência e o acesso à informação são de interesse coletivo de todo o curso.

  page-footer:
    left: |
      **Centro Acadêmico de Gestão Pública (CAGP)**  
      FAFICH • Universidade Federal de Minas Gerais (UFMG)  
      Av. Pres. Antônio Carlos, 6627 - Pampulha, Belo Horizonte - MG  
      [Mapa do Site](mapa-do-site.html) • [Acessibilidade](faq.html#acessibilidade)
    right: |
      Gestão Democrática e Participativa • Desenvolvido com Quarto

format:
  html:
    theme:
      - _variables.scss
    css: styles.css
    toc: true
    toc-title: "Nesta página"
    toc-location: right
    smooth-scroll: true
    include-in-header: _includes/pwa-meta.html
    include-before-body:
      - _includes/skip-links.html
      - _includes/super-app-header.html
    include-after-body:
      - _includes/back-to-top.html
      - _includes/accessibility.html
      - _includes/app-launcher.html
      - _includes/pwa-install.html
      - _includes/super-app-router.html
      - _includes/spotlight-search.html

