      - href: percurso.qmd
        text: Percurso Curricular
      - href: acg.qmd
        text: ACG & Horas
      - href: faq.qmd
        text: Dúvidas Frequentes
      - href: sobre.qmd
        text: Sobre o CAGP
    right:
      - icon: instagram
        href: "https://www.instagram.com/cagpufmg"
        aria-label: "Instagram do CAGP UFMG"
      - icon: envelope
        href: "mailto:cagp@fafich.ufmg.br"
        aria-label: "E-mail oficial do CAGP UFMG"

  page-footer:
    left: |
      **Centro Acadêmico de Gestão Pública (CAGP)**  
      FAFICH • Universidade Federal de Minas Gerais (UFMG)  
      Av. Pres. Antônio Carlos, 6627 - Pampulha, Belo Horizonte - MG
    right: |
