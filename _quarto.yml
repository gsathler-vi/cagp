project:
  type: website
  output-dir: docs
  resources:
    - "documentos/*.pdf"
    - "logos/**"
  render:
    - index.qmd
    - calouros.qmd
    - percurso.qmd
    - estagio-tcc.qmd
    - acg.qmd
    - documentos.qmd
    - faq.qmd
    - sobre.qmd

website:
  title: "CAGP"
  site-url: "https://cagp-ufmg.github.io"
  description: "Centro Acadêmico de Gestão Pública - FAFICH / UFMG"
  favicon: "logos/10_simbolo_transparente_positivo.svg"

  announcement:
    icon: megaphone-fill
    dismissable: false
    position: above-navbar
    type: danger
    content: |
      <span class="cagp-announcement-badge">PROPOSTA DE CHAPA</span> Este portal é uma proposta e projeto da <strong class="cagp-chapa-highlight">Chapa [Nome da Chapa a Definir]</strong> para a gestão do <strong>CAGP (FAFICH/UFMG)</strong>. Como nosso compromisso prioritário é com os discentes, <strong>independentemente do resultado da eleição, disponibilizaremos este projeto completo para a gestão vencedora</strong>, pois a transparência e o acesso à informação são de interesse coletivo de todo o curso.
  
  navbar:
    title: "CAGP"
    logo: "logos/10_simbolo_transparente_positivo.svg"
    logo-alt: "Símbolo dos Candangos - CAGP UFMG"
    background: light
    collapse-below: lg
    left:
      - href: index.qmd
        text: Início
      - href: calouros.qmd
        text: Guia do Calouro
      - href: percurso.qmd
        text: Percurso Curricular
      - href: estagio-tcc.qmd
        text: Estágio & TCC
      - href: acg.qmd
        text: Extensão & AAC
      - href: documentos.qmd
        text: Documentos
      - href: faq.qmd
        text: Dúvidas Frequentes
      - href: sobre.qmd
        text: Sobre o CAGP
    right:
      - icon: instagram
        href: "https://www.instagram.com/cagpufmg"
        aria-label: "Instagram do CAGP UFMG"
      - icon: envelope
        href: "mailto:cagp@fafich.ufmg.br"
        aria-label: "E-mail oficial do CAGP UFMG"

  page-footer:
    left: |
      **Centro Acadêmico de Gestão Pública (CAGP)**  
      FAFICH • Universidade Federal de Minas Gerais (UFMG)  
      Av. Pres. Antônio Carlos, 6627 - Pampulha, Belo Horizonte - MG
    right: |
      Gestão Democrática e Participativa • Desenvolvido com Quarto

format:
  html:
    theme:
      - _variables.scss
    css: styles.css
    toc: true
    toc-title: "Nesta página"
    toc-location: right
    smooth-scroll: true

